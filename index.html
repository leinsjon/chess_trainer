<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Piggy Chess">
  <meta name="theme-color" content="#ffd6e7">
  <title>Piggy Chess</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <section id="home" class="screen active">
      <div class="mascot big">🐷</div>
      <h1>Piggy Chess</h1>
      <div class="home-buttons">
        <button class="big-btn" data-go="lessons">📚 Learn</button>
        <button class="big-btn" data-go="play">♟️ Play</button>
      </div>
    </section>

    <section id="lessons" class="screen">
      <header class="topbar">
        <button class="icon-btn" data-go="home" aria-label="Back">⬅️</button>
        <h2>Learn</h2>
        <span></span>
      </header>
      <div id="lesson-list" class="lesson-list"></div>
    </section>

    <section id="level" class="screen">
      <header class="topbar">
        <button class="icon-btn" data-go="lessons" aria-label="Back">⬅️</button>
        <h2 id="level-title"></h2>
        <button class="icon-btn sound-btn" aria-label="Sound">🔊</button>
      </header>
      <div id="level-dots" class="level-dots"></div>
      <div class="talk-row">
        <div class="mascot">🐷</div>
        <div id="talk" class="bubble"></div>
        <button class="icon-btn repeat-btn" aria-label="Say it again">🗣️</button>
      </div>
      <div class="board-wrap"><div id="board"></div></div>
      <div class="under-board">
        <button class="pill-btn" id="help-btn">💡 Help</button>
      </div>
    </section>

    <section id="play" class="screen">
      <header class="topbar">
        <button class="icon-btn" data-go="home" aria-label="Back">⬅️</button>
        <h2>Play</h2>
        <button class="icon-btn sound-btn" aria-label="Sound">🔊</button>
      </header>
      <div class="talk-row">
        <div class="mascot">🐷</div>
        <div id="play-talk" class="bubble"></div>
        <button class="icon-btn repeat-btn" aria-label="Say it again">🗣️</button>
      </div>
      <div class="board-wrap"><div id="play-board"></div></div>
      <div class="under-board">
        <button class="pill-btn" id="undo-btn">↩️ Undo</button>
        <button class="pill-btn" id="new-game-btn">🔄 New game</button>
      </div>
    </section>

    <div id="overlay" class="overlay hidden">
      <div class="card">
        <div class="mascot big">🐷</div>
        <div id="overlay-stars" class="stars"></div>
        <h2 id="overlay-text"></h2>
        <button class="big-btn" id="overlay-btn">Next ➡️</button>
      </div>
    </div>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
