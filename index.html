<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Piggy Chess">
  <meta name="theme-color" content="#ffd6e7">
  <title>Piggy Chess</title>
  <link rel="icon" type="image/svg+xml" href="assets/pig.svg">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <section id="home" class="screen active">
      <img class="mascot big" src="assets/pig.svg" alt="">
      <h1>Piggy Chess</h1>
      <div class="home-buttons">
        <button class="big-btn" data-go="lessons">📚 Learn</button>
        <button class="big-btn" data-go="play">♟️ Play</button>
        <button class="big-btn little-btn" data-go="tiny">🐣 Little Piggy</button>
      </div>
    </section>

    <section id="lessons" class="screen">
      <header class="topbar">
        <button class="icon-btn" data-go="home" aria-label="Back">⬅️</button>
        <h2>Learn</h2>
        <span></span>
      </header>
      <div id="lesson-list" class="lesson-list"></div>
    </section>

    <section id="level" class="screen">
      <header class="topbar">
        <button class="icon-btn" data-go="lessons" aria-label="Back">⬅️</button>
        <h2 id="level-title"></h2>
        <button class="icon-btn sound-btn" aria-label="Sound">🔊</button>
      </header>
      <div id="level-dots" class="level-dots"></div>
      <div class="talk-row">
        <img class="mascot" src="assets/pig.svg" alt="">
        <div id="talk" class="bubble"></div>
        <button class="icon-btn repeat-btn" aria-label="Say it again">🗣️</button>
      </div>
      <div class="board-wrap"><div id="board"></div></div>
      <div class="under-board">
        <button class="pill-btn" id="help-btn">💡 Help</button>
      </div>
    </section>

    <section id="play" class="screen">
      <header class="topbar">
        <button class="icon-btn" data-go="home" aria-label="Back">⬅️</button>
        <h2>Play</h2>
        <button class="icon-btn sound-btn" aria-label="Sound">🔊</button>
      </header>
      <div class="talk-row">
        <img class="mascot" src="assets/pig.svg" alt="">
        <div id="play-talk" class="bubble"></div>
        <button class="icon-btn repeat-btn" aria-label="Say it again">🗣️</button>
      </div>
      <div class="board-wrap"><div id="play-board"></div></div>
      <div class="under-board">
        <button class="pill-btn" id="undo-btn">↩️ Undo</button>
        <button class="pill-btn" id="new-game-btn">🔄 New game</button>
      </div>
    </section>

    <section id="tiny" class="screen">
      <header class="topbar">
        <button class="icon-btn" data-go="home" aria-label="Back">⬅️</button>
        <h2>Little Piggy</h2>
        <button class="icon-btn sound-btn" aria-label="Sound">🔊</button>
      </header>
      <div class="talk-row">
        <img class="mascot" src="assets/pig.svg" alt="">
        <div id="tiny-talk" class="bubble"></div>
        <button class="icon-btn repeat-btn" aria-label="Say it again">🗣️</button>
      </div>
      <div id="tiny-menu" class="tiny-menu">
        <button class="tiny-game" data-game="meet"><span>👋</span>Meet</button>
        <button class="tiny-game" data-game="find"><span>🔍</span>Find</button>
        <button class="tiny-game" data-game="colors"><span>⚪⚫</span>Colors</button>
        <button class="tiny-game" data-game="home"><span>🏠</span>Home</button>
      </div>
      <div id="tiny-stage" class="tiny-stage"></div>
      <div class="under-board">
        <button class="pill-btn" id="tiny-games-btn">🎲 Games</button>
      </div>
    </section>

    <div id="overlay" class="overlay hidden">
      <div class="card">
        <img class="mascot big" src="assets/pig.svg" alt="">
        <div id="overlay-stars" class="stars"></div>
        <h2 id="overlay-text"></h2>
        <button class="big-btn" id="overlay-btn">Next ➡️</button>
      </div>
    </div>
  </main>
  <div id="boot-error" hidden style="position:fixed;left:16px;right:16px;bottom:16px;background:#fff;border-radius:16px;padding:16px;font:16px/1.4 sans-serif;color:#3b2a4a;z-index:99"></div>
  <script>
    // If the game can't start (an older iPad browser, say), show why instead of a dead page.
    (function () {
      var shown = false;
      function show(why) {
        if (shown || window.piggyReady) return;
        shown = true;
        var el = document.getElementById('boot-error');
        el.hidden = false;
        el.textContent = 'Piggy Chess could not start on this browser. Please send this to Jon: ' + why + ' | ' + navigator.userAgent;
      }
      window.addEventListener('error', function (e) { show(e.message || 'script error'); });
      setTimeout(function () { show('did not load'); }, 6000);
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
